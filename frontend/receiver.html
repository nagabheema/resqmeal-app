<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>resQmeal Pro | Receiver Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>Receiver Portal</h1>
                <p class="subtitle">Manage incoming allocations and local distribution tracking.</p>
            </div>
            <span style="background: var(--accent); color: var(--primary); font-size: 0.75rem; font-weight: 700; padding: 0.5rem 1rem; border-radius: 2rem;">NGO HUB</span>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <p class="metric-label">🍲 Batches Secured</p>
                <p class="metric-value">61</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">💰 Saved Capital</p>
                <p class="metric-value highlight">₹9,200</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">🔥 Kitchen Streak</p>
                <p class="metric-value alert">14 Days</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">⭐ Partner Rating</p>
                <p class="metric-value">5.0</p>
            </div>
        </div>

        <main class="card" style="padding: 1.5rem;">
            <h3 style="margin-bottom: 0.75rem;">Inbound Delivery ETA</h3>
            <div style="border-left: 4px solid var(--secondary); background: var(--bg-main); padding: 1rem; border-radius: 0 4px 4px 0;">
                <p style="font-weight: 700;">Dashed Courier Runner #402</p>
                <p class="subtitle">Bringing 25 Catering Pots • <b>Status: En Route (11 Mins away)</b></p>
            </div>
        </main>
    </div>
</body>
</html>
